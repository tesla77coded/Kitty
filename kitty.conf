inactive_border_color   #45403d
bell_border_color       #d8a657

active_tab_background    #282828
active_tab_foreground    #d4be98
inactive_tab_background  #32302f
inactive_tab_foreground  #7c6f64
tab_bar_background       #1b1b1b

