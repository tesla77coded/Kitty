#         colors/gruvbox-material.vim — g:terminal_color_* mapping)
# ============================================================================

# --- Core UI ---------------------------------------------------------------
background             #000000
#282828
foreground             #d4be98
selection_background   #45403d
selection_foreground   none

cursor                  #d4be98
cursor_text_color       #282828

url_color               #7daea3

# --- Window / tab bar (optional aesthetic extras, safe to remove) ----------
